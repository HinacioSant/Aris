name: Feature Request
description: Request a feature for Aris
title: "[Request]:"
labels: ["enhancement"]

body:
  - type: dropdown
    id: feature-area
    attributes:
      label: What area of Aris does this feature fits?
      options:
        - Extraction
        - Editing 
        - UI
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Description
      description: Describe the Feature
      placeholder: Ability to change the font of a edited word before saving.
    validations:
      required: true

  - type: textarea
    id: feature-reason
    attributes:
      label: Why to want this feature
      description: What problem does this feature solve for you?
      placeholder: My use of Aris specifically demands the edited word to be a different font. 
    validations:
      required: true
